name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: habitflow
          POSTGRES_PASSWORD: habitflow_ci
          POSTGRES_DB: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U habitflow"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      HABITFLOW_TEST_DB: Host=localhost;Port=5432;Username=habitflow;Password=habitflow_ci;Database=postgres
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: dotnet restore
      - run: dotnet build --no-restore -c Release
      - run: dotnet test --no-build -c Release
      - name: Migrations are in sync with the model
        run: |
          dotnet tool restore
          ASPNETCORE_ENVIRONMENT=Development dotnet ef migrations has-pending-model-changes \
            -p src/HabitFlow.Infrastructure -s src/HabitFlow.Api --no-build --configuration Release

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npx prettier --check src e2e
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  e2e:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - name: Configure the stack
        run: |
          {
            echo "POSTGRES_PASSWORD=$(openssl rand -hex 16)"
            echo "WEB_PORT=8080"
            echo "AUTH_RATE_LIMIT_PER_MINUTE=1000"
            echo "DEMO_PASSWORD=Demo12345"
          } > .env
      - run: docker compose up -d --build --wait
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - working-directory: frontend
        run: |
          npm ci
          npx playwright install --with-deps chromium
          E2E_BASE_URL=http://localhost:8080 npm run e2e
      - if: failure()
        run: docker compose logs api web
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-results
          path: frontend/test-results
